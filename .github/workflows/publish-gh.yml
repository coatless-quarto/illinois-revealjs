on:
  push:
    branches: [main, master]
  release:
      types: [published]
  workflow_dispatch:
    
name: demo-website

jobs:
  demo-website:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: quarto-website-${{ github.event_name != 'pull_request' || github.run_id }}
    permissions:
      contents: write
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7

      # To render using knitr, we need a few more setup steps...
      # If we didn't want the examples to use `engine: knitr`, we could
      # skip a few of the setup steps.
      - name: "Setup R"
        uses: r-lib/actions/setup-r@v2

      - name: "Setup R dependencies for Quarto's knitr engine"
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
            packages:
              any::knitr
              any::rmarkdown
              any::downlit
              any::xml2

      # Back to our regularly scheduled Quarto output
      - name: "Set up Quarto"
        uses: quarto-dev/quarto-actions/setup@v2

      # docs/ is kept out of `quarto use template` by .quartoignore, so the site
      # borrows the theme, the template and its screenshot from the repository root
      - name: "Copy the theme and its template into the docs"
        run: |
          cp -R _extensions docs/
          cp template.qmd title-slide-quarto-illinois.png docs/

      - name: "Render and Publish"
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: docs
